<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบผู้ดูแล (Admin Login)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #2c0e58 0%, #4a148c 100%); /* Deep Purple Gradient */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header i {
            font-size: 3rem;
            color: #4a148c;
            background: #f3e5f5;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            display: inline-block;
            margin-bottom: 15px;
        }
        .login-header h4 {
            font-weight: 600;
            color: #333;
        }

        .form-control {
            height: 50px;
            border-radius: 8px;
            padding-left: 45px; /* Space for icon */
        }
        .form-control:focus {
            border-color: #7c43bd;
            box-shadow: 0 0 0 0.25rem rgba(124, 67, 189, 0.25);
        }

        /* Input Icons */
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 1.2rem;
            z-index: 10;
        }

        .btn-login {
            background: #4a148c;
            color: white;
            height: 50px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 500;
            width: 100%;
            transition: 0.3s;
        }
        .btn-login:hover {
            background: #2c0e58;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 20, 140, 0.3);
        }

        /* Password Toggle */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
        }

        .alert-error {
            display: none; /* Hidden by default */
            font-size: 0.9rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container px-3">
        <div class="login-card mx-auto">
            
            <div class="login-header">
                <i class="bi bi-shield-lock-fill"></i>
                <h4>Admin Login</h4>
                <p class="text-muted small">ระบบจัดการค่าธรรมเนียมขยะ</p>
            </div>

            <div id="errorAlert" class="alert alert-danger alert-error d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <div>ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                
                <div class="mb-3 position-relative">
                    <i class="bi bi-person input-icon"></i>
                    <input type="text" class="form-control" id="username" placeholder="ชื่อผู้ใช้งาน (Username)" required>
                </div>

                <div class="mb-4 position-relative">
                    <i class="bi bi-key input-icon"></i>
                    <input type="password" class="form-control" id="password" placeholder="รหัสผ่าน (Password)" required>
                    <i class="bi bi-eye-slash toggle-password" id="togglePassword" onclick="togglePass()"></i>
                </div>

                <button type="submit" class="btn btn-login mb-3">
                    เข้าสู่ระบบ
                </button>

                <div class="text-center">
                    <a href="#" class="text-muted small text-decoration-none">ลืมรหัสผ่าน? ติดต่อฝ่าย IT</a>
                </div>

            </form>
        </div>
        
        <div class="text-center mt-3 text-white opacity-50 small">
            &copy; 2026 Nakorn Chiang Mai Municipality. All Rights Reserved.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. Password Visibility Toggle
        function togglePass() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('togglePassword');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            } else {
                passInput.type = 'password';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            }
        }

        // 2. Mock Login Function
        function handleLogin(event) {
            event.preventDefault(); // Stop page reload

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');

            // --- MOCK CREDENTIALS ---
            // Username: admin
            // Password: 1234
            if (user === 'admin' && pass === '1234') {
                // Success: Redirect to Dashboard
                // In real app, you would save a Token/Cookie here
                window.location.href = 'admin.html';
            } else {
                // Fail: Show Error
                errorAlert.style.display = 'block';
                
                // Shake animation effect
                const card = document.querySelector('.login-card');
                card.style.animation = 'shake 0.3s';
                setTimeout(() => card.style.animation = '', 300);
            }
        }
    </script>
    
    <style>
        /* Simple shake animation for wrong password */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>

</body>
</html>
