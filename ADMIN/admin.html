<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - จัดการค่าขยะ</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f4f6f9;
            overflow-x: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            height: 100vh;
            width: 260px;
            position: fixed;
            top: 0;
            left: 0;
            background: linear-gradient(180deg, #2c0e58 0%, #4a148c 100%);
            color: white;
            padding-top: 20px;
            z-index: 1050;
            transition: all 0.3s ease; /* เพิ่ม Transition ให้ลื่นไหล */
        }

        /* เมื่อ Sidebar ปิด */
        .sidebar.collapsed {
            left: -260px;
        }

        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            padding: 0 15px;
        }

        .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: rgba(255,255,255,0.1);
            color: white;
            border-left: 5px solid #ffcc00;
        }
        .nav-link i { margin-right: 10px; }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        /* เมื่อ Main Content ขยายเต็มหน้าจอ */
        .main-content.expanded {
            margin-left: 0;
        }

        /* ปุ่ม Toggle */
        #sidebarToggle {
            cursor: pointer;
            font-size: 1.5rem;
            margin-right: 15px;
            color: #2c0e58;
        }

        /* Overlay สำหรับมือถือ */
        #sidebarOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 1040;
        }

        @media (max-width: 768px) {
            .sidebar {
                left: -260px; /* ซ่อนไว้ก่อนในมือถือ */
            }
            .sidebar.show {
                left: 0; /* แสดงเมื่อกดปุ่ม */
            }
            .main-content {
                margin-left: 0;
                padding: 15px;
            }
            #sidebarOverlay.show {
                display: block;
            }
        }

        /* UI อื่นๆ */
        .stat-card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .icon-box { width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .table-card { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 20px; margin-top: 25px; }
        .badge-pending { background-color: #fff8e1; color: #f57c00; border: 1px solid #ffe0b2; }
        .badge-success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .badge-danger { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .filter-btn { border-radius: 20px; padding: 5px 15px; font-size: 0.9rem; margin-right: 5px; border: 1px solid #ddd; background: white; transition: 0.2s; }
        .filter-btn.active.pending { background-color: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <div id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar d-flex flex-column" id="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-buildings"></i> <span>เทศบาล Admin</span>
        </div>
        <nav class="nav flex-column">
            <a href="#" class="nav-link active">
                <i class="bi bi-speedometer2"></i> <span>แดชบอร์ด</span>
            </a>
            <a href="#" class="nav-link position-relative">
                <i class="bi bi-file-earmark-check"></i> <span>รอตรวจสอบ</span>
                <span class="position-absolute top-50 end-0 translate-middle-y badge rounded-pill bg-danger me-3" id="sidebarBadge">2</span>
            </a>
            <a href="#" class="nav-link"><i class="bi bi-people"></i> <span>รายชื่อลูกบ้าน</span></a>
            <a href="#" class="nav-link"><i class="bi bi-printer"></i> <span>รายงาน</span></a>
        </nav>
        <div class="mt-auto p-3">
            <a href="#" onclick="signOut()" class="nav-link text-danger">
                <i class="bi bi-box-arrow-left"></i> <span>ออกจากระบบ</span>
            </a>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        
        <div class="d-flex align-items-center mb-4">
            <i class="bi bi-list" id="sidebarToggle" onclick="toggleSidebar()"></i>
            <div>
                <h3 class="fw-bold mb-0">ภาพรวมระบบ</h3>
                <small class="text-muted">เทศบาลตำบลสันกลาง</small>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card stat-card p-3">
                    <div class="d-flex align-items-center">
                        <div class="icon-box bg-success bg-opacity-10 text-success me-3"><i class="bi bi-currency-dollar"></i></div>
                        <div><div class="text-muted small">ยอดชำระเดือนนี้</div><h4 class="fw-bold mb-0">45,200 ฿</h4></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card p-3 border-warning border-start border-4">
                    <div class="d-flex align-items-center">
                        <div class="icon-box bg-warning bg-opacity-10 text-warning me-3"><i class="bi bi-hourglass-split"></i></div>
                        <div><div class="text-muted small">รอตรวจสอบสลิป</div><h4 class="fw-bold mb-0 text-warning" id="pendingCount">2 รายการ</h4></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead>
                        <tr>
                            <th>วันที่แจ้ง</th>
                            <th>ชื่อผู้ชำระ</th>
                            <th>ยอดเงิน</th>
                            <th>สถานะ</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ฟังก์ชัน เปิด-ปิด Sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const overlay = document.getElementById('sidebarOverlay');

            if (window.innerWidth > 768) {
                // Desktop: ยุบ/ขยาย
                sidebar.classList.toggle('collapsed');
                mainContent.classList.toggle('expanded');
            } else {
                // Mobile: เลื่อนเข้า/ออก
                sidebar.classList.toggle('show');
                overlay.classList.toggle('show');
            }
        }

        // Mock Data & Render (ส่วนเดิมของคุณ)
        let transactions = [
            { id: 1, date: '15 ม.ค. 69', name: 'นาย สมชาย ใจดี', amount: 80, status: 'pending' },
            { id: 2, date: '15 ม.ค. 69', name: 'นาง สมหญิง รักสะอาด', amount: 40, status: 'pending' }
        ];

        function renderAdminTable() {
            const tableBody = document.getElementById('adminTableBody');
            let html = '';
            transactions.forEach(tx => {
                html += `
                    <tr>
                        <td>${tx.date}</td>
                        <td class="fw-bold">${tx.name}</td>
                        <td class="text-primary fw-bold">${tx.amount}</td>
                        <td><span class="badge badge-pending">รอตรวจสอบ</span></td>
                        <td><button class="btn btn-sm btn-primary">ตรวจสอบ</button></td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
        }

        renderAdminTable();
    </script>
</body>
</html>
