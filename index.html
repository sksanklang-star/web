<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชำระค่าธรรมเนียมขยะ</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f4f6f9; /* Light modern grey */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            background: white;
            max-width: 800px;
            width: 100%;
        }

        .header-section {
            background: linear-gradient(135deg, #4a148c 0%, #7c43bd 100%); /* Modern Purple Gradient */
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header-section h2 {
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .step-indicator {
            color: #d32f2f;
            font-weight: 600;
            margin: 20px 0;
            text-align: center;
            font-size: 1.1rem;
        }

        .form-label {
            font-weight: 500;
            color: #555;
        }

        /* Customizing Inputs */
        .form-control, .form-select {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #dee2e6;
            background-color: #f8f9fa;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: #7c43bd;
            box-shadow: 0 0 0 0.2rem rgba(124, 67, 189, 0.25);
            background-color: white;
        }

        /* Search Button */
        .btn-search {
            background-color: #1a237e;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 500;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn-search:hover {
            background-color: #283593;
            transform: translateY(-2px); /* Slight lift effect */
            color: white;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .header-section h2 { font-size: 1.4rem; }
            body { align-items: flex-start; padding-top: 20px; }
        }
    </style>
</head>
<body>

    <div class="container px-3">
        <div class="main-card mx-auto">
            
            <div class="header-section">
                <h2><i class="bi bi-wallet2"></i> ชำระค่าธรรมเนียมจัดเก็บขยะ</h2>
                <p class="mb-0 opacity-75">ดูประวัติการชำระเงิน / ภาษีท้องถิ่น</p>
            </div>

            <div class="card-body p-4 p-md-5">
                
                <div class="step-indicator">
                    1. กรอกรายละเอียดเพื่อค้นหา
                </div>

                <form id="wasteForm" class="needs-validation" novalidate>
                    <div class="row g-3">
                        
                        <div class="col-md-6">
                            <label for="yearSelect" class="form-label"><i class="bi bi-calendar-event"></i> ปีงบประมาณ</label>
                            <select class="form-select" id="yearSelect" required>
                                <option value="2569" selected>2569</option>
                                <option value="2568">2568</option>
                                <option value="2567">2567</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="villageSelect" class="form-label"><i class="bi bi-geo-alt"></i> หมู่ที่</label>
                            <select class="form-select" id="villageSelect" required>
                                <option value="" disabled selected>-- เลือกหมู่ --</option>
                                <option value="1">หมู่ที่ 1</option>
                                <option value="2">หมู่ที่ 2</option>
                                <option value="3">หมู่ที่ 3</option>
                                <option value="4">หมู่ที่ 4</option>
                                <option value="5">หมู่ที่ 5</option>
                            </select>
                            <div class="invalid-feedback">กรุณาเลือกหมู่</div>
                        </div>

                        <div class="col-md-6">
                            <label for="houseInput" class="form-label"><i class="bi bi-house-door"></i> บ้านเลขที่</label>
                            <input type="text" class="form-control" id="houseInput" placeholder="เช่น 99/9" required>
                            <div class="invalid-feedback">กรุณาระบุบ้านเลขที่</div>
                        </div>

                        <div class="col-md-6">
                            <label for="payerInput" class="form-label"><i class="bi bi-person"></i> ชื่อผู้ชำระ</label>
                            <input type="text" class="form-control" id="payerInput" placeholder="ระบุชื่อ-สกุล" required>
                            <div class="invalid-feedback">กรุณาระบุชื่อผู้ชำระ</div>
                        </div>

                    </div>

                    <div class="mt-4 pt-2">
                        <button type="submit" class="btn btn-search">
                            <i class="bi bi-search"></i> ค้นหาข้อมูล
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Bootstrap 5 Validation Logic
        (() => {
            'use strict'
            const form = document.getElementById('wasteForm')

            form.addEventListener('submit', event => {
                // If form is invalid, stop everything
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                } else {
                    // If Valid -> Show success (Simulation)
                    event.preventDefault() // Stop refresh for demo
                    const house = document.getElementById('houseInput').value;
                    const name = document.getElementById('payerInput').value;
                    
                    window.location.href = "result.html";
                    // Here you would add your code to send data to backend/database
                }

                form.classList.add('was-validated')
            }, false)
        })()
    </script>
</body>
</html>
