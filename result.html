<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกรายการชำระเงิน</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f4f6f9; /* Same grey as Page 1 */
            min-height: 100vh;
            padding: 20px 0;
        }

        .main-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            background: white;
            max-width: 800px;
            margin: 0 auto;
            overflow: hidden;
        }

        /* 1. Modern Header (Matches Page 1) */
        .header-section {
            background: linear-gradient(135deg, #4a148c 0%, #7c43bd 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header-title {
            font-weight: 600;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        .step-indicator {
            background-color: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            margin-top: 10px;
            font-weight: 300;
        }

        /* 2. Modern Result List Items */
        .result-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            position: relative;
            border-left: 5px solid #4a148c; /* Purple Accent Line */
        }

        .result-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(74, 20, 140, 0.1);
            border-color: #d1c4e9;
        }

        .user-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .user-address {
            color: #666;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* 3. Modern Button */
        .btn-pay {
            background-color: #fff;
            color: #4a148c;
            border: 1px solid #4a148c;
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 500;
            transition: all 0.2s;
            width: 100%; /* Full width on mobile */
        }

        .btn-pay:hover {
            background-color: #4a148c;
            color: white;
        }

        .amount-tag {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        @media (min-width: 768px) {
            .btn-pay { width: auto; } /* Auto width on PC */
            .action-area { text-align: right; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            
            <div class="header-section">
                <div class="header-title"><i class="bi bi-list-check"></i> ผลการค้นหา</div>
                <div class="step-indicator">2. เลือกรายการที่ต้องการชำระ</div>
            </div>

            <div class="card-body p-4">
                
                <div class="alert alert-light border mb-4 d-flex align-items-center text-muted">
                    <i class="bi bi-info-circle me-2"></i>
                    <span>พบข้อมูลทั้งหมด <strong id="countResult">0</strong> รายการ</span>
                </div>

                <div id="resultsContainer"></div>

                <div class="mt-5 text-center">
                    <a href="index.html" class="btn btn-light text-muted px-4 rounded-pill">
                        <i class="bi bi-arrow-left"></i> กลับไปหน้าค้นหา
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. Mock Data
        const mockData = [
            {
                id: 101,
                name: "นาย สมชาย ใจดี",
                houseNo: "111",
                village: "1",
                amount: 480,
                year: 2569
            },
            {
                id: 102,
                name: "นาง สมหญิง รักสะอาด",
                houseNo: "111/2",
                village: "1",
                amount: 480,
                year: 2569
            },
            {
                id: 103,
                name: "บริษัท ร้านค้าเจริญรุ่งเรือง จำกัด",
                houseNo: "112",
                village: "1",
                amount: 1200,
                year: 2569
            }
        ];

        // 2. Render Logic
        const container = document.getElementById('resultsContainer');
        const countLabel = document.getElementById('countResult');

        countLabel.innerText = mockData.length;

        if (mockData.length > 0) {
            mockData.forEach(item => {
                const cardHTML = `
                    <div class="result-card">
                        <div class="row align-items-center g-3">
                            
                            <div class="col-auto d-none d-sm-block">
                                <div style="width: 50px; height: 50px; background: #f3e5f5; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #4a148c;">
                                    <i class="bi bi-person-fill fs-4"></i>
                                </div>
                            </div>

                            <div class="col">
                                <div class="user-name">${item.name}</div>
                                <div class="user-address">
                                    <i class="bi bi-house-door"></i> บ้านเลขที่ ${item.houseNo} หมู่ที่ ${item.village}
                                    <span class="ms-2 badge bg-light text-dark border">ปี ${item.year}</span>
                                </div>
                            </div>

                            <div class="col-12 col-md-auto action-area">
                                <div class="mb-2 d-none d-md-block">
                                    <span class="amount-tag"><i class="bi bi-tag-fill"></i> ${item.amount} บาท</span>
                                </div>
                                <button class="btn btn-pay" onclick="selectPayment(${item.id})">
                                    ชำระเงิน <i class="bi bi-arrow-right-short"></i>
                                </button>
                            </div>
                            
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        } else {
            container.innerHTML = '<div class="text-center py-5 text-muted">ไม่พบข้อมูลที่ค้นหา</div>';
        }

        function selectPayment(id) {
            const user = mockData.find(u => u.id === id);
            window.location.href = "payment.html";
        }
    </script>

</body>
</html>
